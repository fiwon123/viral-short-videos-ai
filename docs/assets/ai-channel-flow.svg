<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="title desc">
  <title id="title">From channel idea to finished Short</title>
  <desc id="desc">Choose an audience and format, build an identity, make a preview, then deliver the upload package.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111127"/>
      <stop offset="1" stop-color="#101D33"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="350" rx="22" fill="url(#background)" stroke="#364664" stroke-width="2"/>
  <g font-family="system-ui, Arial, sans-serif">
    <text x="30" y="59" fill="#F8FAFC" font-size="34" font-weight="700">From channel idea to finished Short</text>
    <g transform="translate(30 85)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#C4B5FD"/>
      <text x="30" y="33" fill="#C4B5FD" font-size="24" font-weight="700">1. Choose a format</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">Pick an audience and</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">a repeatable premise</text>
    </g>
    <g transform="translate(390 85)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#93C5FD"/>
      <text x="30" y="33" fill="#93C5FD" font-size="24" font-weight="700">2. Build the channel</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">Name, logo, banner,</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">palette and voice</text>
    </g>
    <g transform="translate(30 206)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#5EEAD4"/>
      <text x="30" y="33" fill="#5EEAD4" font-size="24" font-weight="700">3. Make a preview</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">Story beats, animation,</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">captions and sound</text>
    </g>
    <g transform="translate(390 206)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#FDE68A"/>
      <text x="30" y="33" fill="#FDE68A" font-size="24" font-weight="700">4. Review and export</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">MP4, thumbnail and</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">publishing copy</text>
    </g>
  </g>
</svg>
