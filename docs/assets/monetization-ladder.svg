<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="title desc">
  <title id="title">Shorts monetization milestones</title>
  <desc id="desc">YouTube thresholds for early access, ads and monthly earnings, and TikTok Creator Rewards entry. See the page for eligibility details.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111127"/>
      <stop offset="1" stop-color="#101D33"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="350" rx="22" fill="url(#background)" stroke="#364664" stroke-width="2"/>
  <g font-family="system-ui, Arial, sans-serif">
    <text x="30" y="59" fill="#F8FAFC" font-size="34" font-weight="700">Shorts monetization milestones</text>
    <g transform="translate(30 85)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#C4B5FD"/>
      <text x="30" y="33" fill="#C4B5FD" font-size="24" font-weight="700">YouTube · Early access</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">500 subscribers</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">3M Shorts views / 90 days</text>
    </g>
    <g transform="translate(390 85)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#93C5FD"/>
      <text x="30" y="33" fill="#93C5FD" font-size="24" font-weight="700">YouTube · Ads entry</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">1K subscribers + 10M views</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">20M from Feb 1, 2027</text>
    </g>
    <g transform="translate(30 206)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#5EEAD4"/>
      <text x="30" y="33" fill="#5EEAD4" font-size="24" font-weight="700">YouTube · Monthly pool</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">From Feb 1, 2027</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">10M Shorts views / 90 days</text>
    </g>
    <g transform="translate(390 206)">
      <rect width="340" height="101" rx="12" fill="#1C2941" stroke="#3D4F70"/>
      <rect x="12" y="14" width="4" height="73" rx="2" fill="#FDE68A"/>
      <text x="30" y="33" fill="#FDE68A" font-size="24" font-weight="700">TikTok · Creator Rewards</text>
      <text x="30" y="61" fill="#F1F5F9" font-size="21">10K followers</text>
      <text x="30" y="85" fill="#CBD5E1" font-size="21">100K video views / 30 days</text>
    </g>
